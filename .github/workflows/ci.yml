name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ninja-stub-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run NinjaTrader-independent tests
        shell: powershell
        run: ./scripts/test-ninja.ps1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:web
      - run: npm run lint:web
      - run: npm run build:web
