name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# One run, cancelled by the next push on the same branch. Without this a burst
# of commits leaves several runs competing for the same runners, which is one of
# the ways a job ends up reported as cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ninja-stub-tests:
    # Linux, not Windows. The Windows runner was the fragile half of this
    # workflow: scarcer, billed at twice the rate, and when one cannot be
    # allocated the job reports as CANCELLED - which reads like a broken build
    # when nothing is broken. Mono is also the toolchain these tests are written
    # against day to day, so a green run here means what it says.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mono-devel
      - name: Compile and run NinjaTrader-independent tests
        run: ./scripts/test-ninja.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:web
      - run: npm run lint:web
      - run: npm run build:web
